[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-mcp-server"
version = "1.0.0"
description = "XML tools MCP server with validation, parsing, XPath queries, XSLT transformation, and schema generation"
authors = [{name = "MCP Team"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "mcp>=0.1.0",
    "lxml>=4.9.0",
    "xmlschema>=2.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0"
]
