[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-mcp-server"
version = "1.0.0"
description = "Computer Vision MCP server with segmentation, object detection, captioning, and image processing tools"
authors = [{name = "MCP Team"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "mcp>=0.1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "segment-anything>=1.0",
    "timm>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0"
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100
